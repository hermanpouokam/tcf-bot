services:
  tcf-bot:
    build: .
    container_name: tcf-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /home/ubuntu/tcf-storage/data:/app/data
      - /home/ubuntu/tcf-storage/logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=3000
    # Requis pour Chromium headless dans Docker
    security_opt:
      - seccomp:unconfined
    shm_size: 512mb